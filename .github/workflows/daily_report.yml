name: Codzienny Raport WIG20

on:
  schedule:
    - cron: '30 6 * * 1-5'
  workflow_dispatch:
    inputs:
      test_alert:
        description: 'Wymuś błąd, żeby przetestować alert'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  send-report:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout kodu
        uses: actions/checkout@v4

      - name: Wymuszony błąd (test alertu)
        if: ${{ inputs.test_alert }}
        run: exit 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalacja zależności
        run: |
          pip install requests matplotlib pandas python-dotenv yfinance scikit-learn numpy groq

      - name: Odśwież historię cen
        run: python backend/daily_snapshot.py

      - name: Wyslij raport
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_PL }}
          DISCORD_WEBHOOK_PL: ${{ secrets.DISCORD_WEBHOOK_PL }}
          DISCORD_WEBHOOK_ENG: ${{ secrets.DISCORD_WEBHOOK_ENG }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python discord_report.py
          python discord_report_en.py

      - name: Zapisz dziennik sygnałów
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A data
          if git diff --cached --quiet; then
            echo "Brak zmian"
          else
            git commit -m "dane i dziennik sygnałów $(date -u +%F)"
            git pull --rebase origin ${{ github.ref_name }}
            git push
          fi

      - name: Alert o awarii
        if: failure()
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_PL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -sS -H "Content-Type: application/json" \
            -d "{\"content\": \"⚠️ Raport WIG20 nie wyszedł. Sprawdź przebieg: ${RUN_URL}\"}" \
            "$WEBHOOK" || true