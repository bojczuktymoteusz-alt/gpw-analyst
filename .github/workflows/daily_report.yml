name: Codzienny Raport WIG20

on:
  schedule:
    - cron: '30 6 * * 1-5'  # 8:30 czasu polskiego (UTC+2)
  workflow_dispatch:

jobs:
  send-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kodu
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalacja zależności
        run: |
          pip install requests matplotlib pandas python-dotenv yfinance scikit-learn numpy groq

      - name: Wyslij raport
        env:
          DISCORD_WEBHOOK_PL: ${{ secrets.DISCORD_WEBHOOK_PL }}
          DISCORD_WEBHOOK_ENG: ${{ secrets.DISCORD_WEBHOOK_ENG }}