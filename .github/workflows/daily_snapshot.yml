name: Dzienny snapshot GPW

on:
  schedule:
    # 16:30 UTC = 18:30 latem / 17:30 zimą - w obu przypadkach po zamknięciu GPW
    - cron: '30 16 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gpw-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout kodu
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalacja zależności
        run: pip install yfinance pandas

      - name: Pobierz snapshot
        run: python backend/daily_snapshot.py

      - name: Zapisz do repo
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/daily_prices.csv
          if git diff --cached --quiet; then
            echo "Brak zmian"
          else
            git commit -m "snapshot $(date -u +%F)"
            git pull --rebase origin ${{ github.ref_name }}
            git push
          fi